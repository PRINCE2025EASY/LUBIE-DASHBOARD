<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/lubie/public
    <Directory /var/www/lubie/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    # Only public/ is served; src, config, vendor and database stay outside the web root.
    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 "%{X-Forwarded-For}i %h %t \"%r\" %>s %b %D"
</VirtualHost>
ServerTokens Prod
TraceEnable Off
